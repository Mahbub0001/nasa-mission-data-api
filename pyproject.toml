
[project]
name = "nasa-mission-data-api"
version = "1.0.0"
description = "FastAPI wrapper for NASA NEAR historical data and JPL small-body APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.0",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "main:app"
